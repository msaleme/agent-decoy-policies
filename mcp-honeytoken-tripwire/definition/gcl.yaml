---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP Honeytoken Tripwire
    category: Security
    description: >-
      A decoy tripwire for agent traffic. You plant a honeytoken — a fake
      credential, record, or identifier with NO legitimate use — in the data an
      agent can reach. This policy watches every request and every response
      flowing through the gateway for that value. A well-chosen decoy matched
      appropriately to local traffic yields an event worth investigating; this
      policy cannot establish that a match proves compromise. Matching is
      presence-only, so a token quoted in ordinary text can trigger it. On a hit
      it emits a structured anomaly and, in block mode, refuses eligible requests
      and withholds or redacts eligible responses.
      Maps to NIST SP 800-53 Rev 5 SC-26 (Decoys) and SI-20 (Tainting), and
      NIST SP 800-160 Vol 2 Rev 1 cyber-resiliency Deception (Disinformation).
    metadata/capabilities/injectionPoint: inbound
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    honeytokens:
      type: array
      default: []
      items:
        type: string
      description: >-
        The decoy values to watch for. Each must be a token that has no
        legitimate use anywhere in normal traffic — a fake API key, a synthetic
        customer record ID, a decoy email, a bogus internal URL. Any request or
        response containing one of these strings trips the wire. Plant the same
        value in the agent's reachable data (a decoy record, a seeded tool
        result) so a compromised agent can find and touch it.
    decoyIds:
      type: array
      default: []
      items:
        type: string
      description: >-
        Opaque operator-assigned identifiers for honeytokens, in the same order as
        honeytokens. These identifiers, never the token values or prefixes, are
        emitted in anomaly events. Supply one unique identifier per token to retain
        per-decoy correlation without disclosing a value in logs. An empty or omitted
        list uses positional unlabeled-decoy-N labels; a nonempty list must have one
        unique, nonblank identifier per honeytoken.
    mode:
      type: string
      default: monitor
      enum:
        - monitor
        - block
      description: >-
        "monitor" — emit an anomaly using an opaque decoy ID and stamp the alert
        header, while preserving body bytes. Eligible inspection buffers bodies
        and can add latency and memory use. Every deployment, including monitor,
        requires change-management review of traffic, resources, event access and
        retention. Events do not include matched token values or raw message bodies.
        "block" — reject matching requests and redact or withhold eligible responses,
        subject to the documented response-write capability boundary. JSON-RPC
        denials use HTTP 200 with error -32008, or HTTP 202 without a body for
        notification-only input; generic matching requests use HTTP 403.
        Enforcing modes require additional review of availability and data changes.
    alertHeader:
      type: string
      default: x-agent-decoy-tripwire
      description: >-
        Name of the header stamped on the request/response when the wire trips.
        Downstream logging, SIEM forwarders, and the Kill Switch can key off it.
    caseSensitive:
      type: boolean
      default: false
      description: >-
        Whether honeytoken matching is case-sensitive. Defaults to false so
        casing changes by an intermediary agent do not evade the tripwire.
  required:
    - honeytokens
    - mode
    - alertHeader
    - caseSensitive
