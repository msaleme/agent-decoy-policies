[package]
name = "decoy_tool_sentinel"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "REPLACE_WITH_YOUR_ANYPOINT_ORG_ID"
definition_asset_id = "decoy-tool-sentinel"
implementation_asset_id = "decoy-tool-sentinel-flex"

[dependencies]
# enable_stop_iteration exposes into_headers_body_state, so a single filter can
# both inspect the body and stamp headers on the same request/response.
pdk = { version = "1.9.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.9.0" }
pdk-unit = { version = "1.9.0", features = ["enable_stop_iteration"] }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
