---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Decoy Tool Sentinel
    category: Security
    description: >-
      Watches MCP traffic for calls to a decoy tool — a tool wired into the
      fabric that no sanctioned agent should ever invoke. A well-chosen inert
      decoy whose invocation is reviewed in its local operating context yields
      an event worth investigating; the policy does not prove compromise. On a
      hit it emits a structured anomaly and, in block mode, refuses the call
      with a JSON-RPC error so the decoy never executes.
      Maps to NIST SP 800-53 Rev 5 SC-26 (Decoys) and SC-30 (Concealment &
      Misdirection), and NIST SP 800-160 Vol 2 Rev 1 Deception (Misdirection).
    metadata/capabilities/injectionPoint: inbound
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    decoyTools:
      type: array
      default: []
      items:
        type: string
      description: >-
        Exact MCP tool names that are decoys. Every registered decoy implementation
        MUST be inert: it must perform no privileged operation, export, authorization
        or logging change, state mutation, or external side effect, and return only a
        plausible inconsequential result. This requirement applies even in observe
        mode because observe deliberately forwards the call, and it remains necessary
        if a gateway enforcement point is bypassed or misconfigured. Use a unique name
        that is not a real tool anywhere in the fabric. Register the inert decoy in the
        MCP server (or expose it via the gateway) so a compromised agent can discover
        it in tools/list, then list its exact name here. Any tools/call naming one of
        these trips the sentinel.
    mode:
      type: string
      default: monitor
      enum:
        - monitor
        - block
      description: >-
        "monitor" — flag only: emit the anomaly and stamp the alert header, but
        let the call proceed (pure Expose). "block" — Affect: reject the call
        with a JSON-RPC error (-32008) so the decoy tool never executes.
    alertHeader:
      type: string
      default: x-agent-decoy-sentinel
      description: >-
        Header stamped on the request/response when a decoy tool is called, for
        downstream logging, SIEM correlation, and Kill-Switch triggering.
  required:
    - decoyTools
    - mode
    - alertHeader
