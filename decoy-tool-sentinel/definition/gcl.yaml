---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Decoy Tool Sentinel
    category: Security
    description: >-
      Watches MCP traffic for calls to a decoy tool — a tool wired into the
      fabric that no sanctioned agent should ever invoke (e.g. dump_all_records,
      export_secrets). Because no legitimate workflow calls it, a single
      tools/call to that name is an unambiguous, high-fidelity signal that an
      agent has been hijacked or is probing for reach. On a hit it emits a
      structured anomaly (CISA "Expose") and, in block mode, refuses the call
      with a JSON-RPC error so the decoy never executes (CISA "Affect").
      Maps to NIST SP 800-53 Rev 5 SC-26 (Decoys) and SC-30 (Concealment &
      Misdirection), and NIST SP 800-160 Vol 2 Rev 1 Deception (Misdirection).
    metadata/capabilities/injectionPoint: inbound
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    decoyTools:
      type: array
      default: []
      items:
        type: string
      description: >-
        MCP tool names that are decoys. Each must be a tool no legitimate agent
        ever needs to call. Register the decoy in the MCP server (or expose it
        via the gateway) so a compromised agent can discover it in tools/list,
        then list its exact name here. Any tools/call naming one of these trips
        the sentinel.
    mode:
      type: string
      default: monitor
      enum:
        - monitor
        - block
      description: >-
        "monitor" — flag only: emit the anomaly and stamp the alert header, but
        let the call proceed (pure Expose). "block" — Affect: reject the call
        with a JSON-RPC error (-32008) so the decoy tool never executes.
    alertHeader:
      type: string
      default: x-agent-decoy-sentinel
      description: >-
        Header stamped on the request/response when a decoy tool is called, for
        downstream logging, SIEM correlation, and Kill-Switch triggering.
  required:
    - decoyTools
    - mode
    - alertHeader
