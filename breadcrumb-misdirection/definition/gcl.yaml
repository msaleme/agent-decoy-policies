---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Breadcrumb Misdirection
    category: Security
    description: >-
      Plants a benign breadcrumb — a lure that names a resource no real task
      needs (a fake /admin/override endpoint, a decoy "internal" tool) — into the
      descriptions an agent reads from tools/list. A healthy agent ignores it; an
      agent may later reference it in a request. This is a detection-only
      breadcrumb: it does not lead to another decoy asset or controlled
      environment. The configured mode determines whether the gateway observes,
      sanitizes, or blocks a detected follow.
      Maps to NIST SP 800-53 Rev 5 SC-30 (Concealment & Misdirection) and SI-4
      (Monitoring), and NIST SP 800-160 Vol 2 Rev 1 Deception (Misdirection).
    metadata/capabilities/injectionPoint: inbound
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    breadcrumb:
      type: string
      default: ""
      description: >-
        The lure text appended to tool descriptions in tools/list responses, and
        the exact marker watched for on inbound requests. Make it distinctive and
        obviously off-task so no legitimate request would ever contain it — e.g.
        "admin_override_do_not_use". A sentence matches only in full, not by a resource
        name embedded within it.
        Any request carrying this string is a followed breadcrumb.
    mode:
      type: string
      default: observe
      enum:
        - observe
        - sanitize
        - block
      description: >-
        "observe" — emit the anomaly and stamp the alert header, then forward the
        request unmodified. "sanitize" — emit and stamp, remove the breadcrumb from
        the request, then forward the transformed request. "block" — emit and stamp,
        then reject the request that followed the breadcrumb (403). Only
        seeding=disabled with mode=observe preserves bodies in both directions;
        alert headers may still be stamped. Unsupported enforcing requests are rejected.
    seeding:
      type: string
      default: disabled
      enum:
        - disabled
        - enabled
      description: >-
        Controls only tools/list response seeding, independently of detection mode.
        "enabled" appends the breadcrumb to tool descriptions; "disabled" leaves
        responses unchanged. Enabling seeding is a response transformation and
        requires change-management review.
    alertHeader:
      type: string
      default: x-agent-breadcrumb
      description: >-
        Header stamped on a request that followed the breadcrumb, for downstream
        logging, SIEM correlation, and Kill-Switch triggering.
  required:
    - breadcrumb
    - mode
    - seeding
    - alertHeader
