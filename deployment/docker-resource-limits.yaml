# Opt-in example for the existing local-flex playground service, not a sizing SLA.
services:
  local-flex:
    cgroup: private
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      FLEX_DOWNSTREAM_CONNECTION_BUFFER_LIMIT_BYTES: "65536"
      FLEX_UPSTREAM_RESPONSE_TIMEOUT_SECONDS: "15"
      FLEX_STREAM_IDLE_TIMEOUT_SECONDS: "15"
