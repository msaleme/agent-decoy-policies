global
    maxconn 64
    tune.bufsize 131072
    nbthread 1

defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s
    timeout http-request 2s

frontend upload_gate
    bind "${EDGE_BIND}"
    # Strict bounded POST transport. Flex remains responsible for policy decisions.
    http-request deny deny_status 405 unless METH_POST
    http-request deny deny_status 400 if { req.hdr_cnt(transfer-encoding) gt 0 }
    http-request deny deny_status 400 unless { req.hdr_cnt(content-length) eq 1 }
    http-request deny deny_status 400 unless { req.hdr(content-length) -m reg ^[0-9]{1,5}$ }
    http-request set-var(txn.declared) req.hdr_val(content-length)
    http-request deny deny_status 413 if { var(txn.declared) -m int gt 65536 }
    http-request wait-for-body time 2s
    # wait-for-body also returns when the buffer fills. Never forward a prefix.
    http-request deny deny_status 413 unless { req.body_len,sub(txn.declared) eq 0 }
    default_backend gateway

backend gateway
    server flex "${FLEX_ADDRESS}"
